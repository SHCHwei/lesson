services:
  # 1. MySQL Database Service
  db:
    image: mysql:8.0
    container_name: lesson-db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lesson
      MYSQL_USER: user
      MYSQL_PASSWORD: user1
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lesson-backend-network


  # 2. Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: lesson-redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lesson-backend-network

  # 3. Golang Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lesson-backend
    restart: always
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ./logs:/logs
    command: 
      - sh
      - -c
      - |
        echo "安裝 air..."
        go install github.com/air-verse/air@v1.52
        echo "建立 logs 目錄..."
        mkdir -p /logs
        echo "啟動 air..."
        air -c .air.toml 2>&1 | tee /logs/backend.log
    environment:
      DOMAIN: localhost
      PORT: 8080
      DB_USER: user
      DB_PASSWORD: user1
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: lesson
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      ENV: dev
      Frontend_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lesson-backend-network

  # 4. React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lesson-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: >
      sh -c "
        if [ ! -f .env ] && [ -f .env.example ]; then
          cp .env.example .env
        fi &&
        npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - lesson-network      

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local


networks:
  lesson-backend-network:
    driver: bridge
  lesson-network:
    driver: bridge